name: Build FRAGBOT Bridge Windows Installer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-fragbot-bridge-pr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout isolated Bridge branch
        uses: actions/checkout@v4
        with:
          ref: build/fragbot-bridge-windows

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: tools/fragbot-bridge
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        working-directory: tools/fragbot-bridge
        run: npm run check

      - name: Build Windows NSIS installer
        working-directory: tools/fragbot-bridge
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Rename installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'tools/fragbot-bridge/dist' -Filter '*.exe' | Where-Object { $_.Name -notlike '*uninstaller*' } | Sort-Object Length -Descending | Select-Object -First 1
          if ($null -eq $installer) { throw 'No Windows installer found.' }
          Copy-Item $installer.FullName 'FRAGBOT-Bridge-Setup-v0.1.0.exe'

      - name: Publish prerelease installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fragbot-bridge-v0.1.0-build --cleanup-tag --yes 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          gh release create fragbot-bridge-v0.1.0-build 'FRAGBOT-Bridge-Setup-v0.1.0.exe' --target build/fragbot-bridge-windows --title 'FRAGBOT Bridge v0.1.0 Build' --notes 'Unsigned Windows installer build for FRAGBOT Bridge / Meld Studio integration.' --prerelease
