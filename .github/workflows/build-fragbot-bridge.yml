name: Build FRAGBOT Bridge Windows Installer

on:
  push:
    branches:
      - build/fragbot-bridge-windows
    paths:
      - 'tools/fragbot-bridge/**'
      - '.github/workflows/build-fragbot-bridge.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/fragbot-bridge/**'
      - '.github/workflows/build-fragbot-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/fragbot-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: npm run check

      - name: Build Windows NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Select-Object FullName,Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: FRAGBOT-Bridge-Windows-v0.1.0
          path: tools/fragbot-bridge/dist/*.exe
          if-no-files-found: error
          retention-days: 30
